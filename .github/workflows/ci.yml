name: Independent local lists and official-search fallback validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows-foundation:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, reviewed 2026-11-04
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12.7'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Create independent environment and install locked dependencies
        shell: pwsh
        run: ./scripts/init.ps1 -Python python
      - name: Lint, types, unit tests, real loopback HTTP, desktop H5 build and secret scan
        shell: pwsh
        run: ./.venv/Scripts/python.exe scripts/verify.py --stage S5 --target desktop
      - name: Show synthetic frontend test diagnostics on failure
        if: failure()
        shell: pwsh
        run: |
          $testLog = '.local/logs/s5-desktop-validation/frontend-test.log'
          if (Test-Path -LiteralPath $testLog) {
            Get-Content -LiteralPath $testLog -Tail 300
          }
# No secrets, deployment, external AI/product API tests or public publishing.
# Actual remote execution is recorded in docs/VALIDATION.md; this file is not proof of a pass.
