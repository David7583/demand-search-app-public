[project]
name = "demand-search-app"
version = "0.0.3.dev0"
description = "Independent Demand Search App: S2 demand revisions and local NCP adaptation"
requires-python = "==3.12.7"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/server/src"]
addopts = "-ra --basetemp=.local/pytest"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".local", "apps/client"]

[tool.ruff.lint]
select = ["E", "F", "I"]
